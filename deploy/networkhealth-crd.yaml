apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkhealths.demo.io
spec:
  group: demo.io
  scope: Namespaced
  names:
    plural: networkhealths
    singular: networkhealth
    kind: NetworkHealth
    shortNames: [nh]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [sourcePodPrefix, destinationPodPrefix]
              properties:
                sourcePodPrefix:
                  type: string
                destinationPodPrefix:
                  type: string
                healthyWindowSeconds:
                  type: integer
                  minimum: 1
                  default: 10
            status:
              type: object
              properties:
                healthy:
                  type: boolean
                reason:
                  type: string
                message:
                  type: string
                droppedFlows:
                  type: integer
                lastObserved:
                  type: string
                  format: date-time
                lastDrop:
                  type: string
                  format: date-time
