apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: silent-drops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: silent-drops-frontend:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend.silent-drops.svc.cluster.local:8081/
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: silent-drops
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
