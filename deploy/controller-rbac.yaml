apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-health-controller
  namespace: silent-drops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: network-health-controller
  namespace: silent-drops
rules:
  - apiGroups: ["demo.io"]
    resources: ["networkhealths"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["demo.io"]
    resources: ["networkhealths/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: network-health-controller
  namespace: silent-drops
subjects:
  - kind: ServiceAccount
    name: network-health-controller
    namespace: silent-drops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: network-health-controller
