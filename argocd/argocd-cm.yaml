apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.health.demo.io_NetworkHealth: |
    local hs = {}
    if obj.status == nil or obj.status.healthy == nil then
      hs.status = "Progressing"
      hs.message = "Waiting for network-health controller to publish status"
    elseif obj.status.healthy == false then
      hs.status = "Degraded"
      hs.message = obj.status.message or obj.status.reason or "Network connectivity problem detected"
    else
      hs.status = "Healthy"
      hs.message = obj.status.message or "No relevant dropped flows observed"
    end
    return hs
